<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>
    <header>
        <h1>Tui Perfumes Inventory</h1>
        <p class="tagline">Track · Manage · Grow</p>
    </header>
    <section>
        <form id="entry-form">
            <div class="field">
                <label for="item-name">Item Name</label>
                <input type="text" id="item-name" required>
            </div>
            <div class="field">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" min="1" required>
            </div>
            <div class="field">
                <label for="category">Category</label>
                <select id="category" required>
                  <option value="" selected>Select a category</option>
                    <option value="eau-de-parfum">Eau de Parfum</option>
                    <option value="eau-de-toilette">Eau de Toilette</option>
                    <option value="body-mist">Body Mist</option>
                    <option value="body-oil">Body Oil</option>
                </select>
            </div>
            <div class="field">
                <label for="type">Type</label>
                <select id="type" required>
                 <option value="" selected>Select a type</option>
                    <option value="added">Added</option>
                    <option value="sold">Sold</option>
                </select>
            </div>
            <button id="add-btn" type="submit">Add Item</button>

        </form>
    </section>

    <div class="stats">
    <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-box"></i></div>
        <div class="stat-text">
            <p>Total Added</p>
            <span id="total-added">0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-cart-shopping"></i></div>
        <div class="stat-text">
            <p>Total Sold</p>
            <span id="total-sold">0</span>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-cubes"></i></div>
        <div class="stat-text">
            <p>Current Stock</p>
            <span id="current-stock">0</span>
        </div>
    </div>
</div>
    <section>
    <div class="log-header">
        <div>
            <h2>Inventory Log</h2>
            <p class="subtitle">A record of all items added and sold.</p>
        </div>
        <div class="filter-btn">
            <button type="button" id="filter-all" class="active">All</button>
            <button type="button" id="filter-added">Added</button>
            <button type="button" id="filter-sold">Sold</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Type</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="entries-body">

            </tbody>
        </table>
    </div>
</section>

    <script src="script.js"></script>
</body>

</html>
