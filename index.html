<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Tracker</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    <header>
        <h1>Tui Perfumes Inventory</h1>
    </header>
    <section>
        <form>
            <label for="item-name">Item Name</label>
            <input type="text" id="item-name" required>
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" required>
            <label for="category">Category</label>
            <select  id="category" required>
                <option value="">Select a category</option>
                <option value="eau-de-parfum">Eau de Parfum</option>
                <option value="eau-de-toilette">Eau de Toilette</option>
                <option value="body-mist">Body Mist</option>
                <option value="body-oil">Body Oil</option>
            </select>
            <label for="type">Type</label>
            <select  id="type" required>
                <option value="">Select a type</option>
                <option value="added">Added</option>
                <option value="sold">Sold</option>
            </select>
            <button id="add-btn" type="submit">Add Item</button>

        </form>
    </section>

    <section>
        <h2>Totals</h2>
        <p>Total Added: <span id="total-added">0</span></p>
        <p>Total Sold: <span id="total-sold">0</span></p>
        <p>Current Stock: <span id="current-stock">0</span></p>
    </section>

    <section>
        <h2>Entries</h2>
        <button type="button" id="filter-all">All</button>
          <button type="button" id="filter-added">Added</button>
            <button type="button" id="filter-sold">Sold</button>
    </section>
  
    <script src="script.js"></script> 
</body>
</html>
